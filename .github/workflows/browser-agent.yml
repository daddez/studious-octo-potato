name: browser-agent

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to render'
        required: true
        type: string
      job_id:
        description: 'Job ID'
        required: true
        type: string

concurrency:
  group: browser-${{ inputs.job_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Enable safaridriver (real Safari)
        run: sudo safaridriver --enable

      - name: Install Python dependencies
        run: pip3 install --user --break-system-packages selenium requests

      - name: Render URL with Safari + 2captcha
        env:
          URL: ${{ inputs.url }}
          JOB_ID: ${{ inputs.job_id }}
          CAPTCHA_API_KEY: ${{ secrets.TWOCAPTCHA }}
        run: python3 render.py

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: render-results-${{ inputs.job_id }}
          path: render-results/
          retention-days: 7
