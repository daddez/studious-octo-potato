name: queue-processor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: queue-processor-lock
  cancel-in-progress: true

jobs:
  process:
    runs-on: macos-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check queue and extract URL
        id: queue
        run: |
          python3 << 'PYEOF'
          import json
          import os
          import time

          with open('queue.json', 'r') as f:
              queue_data = json.load(f)

          urls = queue_data.get('urls', [])
          if not urls:
              print("Queue empty")
              exit(0)

          current_url = urls[0]
          job_id = f"queue-{int(time.time())}"

          print(f"Processing: {current_url}")
          print(f"Job ID: {job_id}")

          # Output for next steps
          with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as f:
              f.write(f"current_url={current_url}\n")
              f.write(f"job_id={job_id}\n")
              f.write(f"has_url=true\n")
          PYEOF

      - name: Install Python dependencies
        if: steps.queue.outputs.has_url == 'true'
        run: |
          pip install --user selenium requests

      - name: Process via Safari
        if: steps.queue.outputs.has_url == 'true'
        env:
          URL: ${{ steps.queue.outputs.current_url }}
          JOB_ID: ${{ steps.queue.outputs.job_id }}
          TWOCAPTCHA: ${{ secrets.TWOCAPTCHA_API_KEY }}
        run: |
          python3 render.py

      - name: Update queue after processing
        if: always() && steps.queue.outputs.has_url == 'true'
        run: |
          python3 << 'PYEOF'
          import json
          import subprocess

          with open('queue.json', 'r') as f:
              queue_data = json.load(f)

          if queue_data.get('urls'):
              queue_data['urls'].pop(0)
              queue_data['processing'] = False

              with open('queue.json', 'w') as f:
                  json.dump(queue_data, f, indent=2)

              subprocess.run(['git', 'config', 'user.name', 'queue-processor-bot'], check=False)
              subprocess.run(['git', 'config', 'user.email', 'queue-processor@bot.local'], check=False)
              subprocess.run(['git', 'add', 'queue.json'], check=False)

              result = subprocess.run(['git', 'commit', '-m', '[QUEUE] URL processed'], capture_output=True)
              if result.returncode == 0:
                  subprocess.run(['git', 'push', 'origin', 'main'], check=False, timeout=30)
          PYEOF

      - name: Upload artifacts
        if: steps.queue.outputs.has_url == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: render-results
          path: render-results/
          retention-days: 7
          if-no-files-found: ignore
